[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-work-model"
version = "0.1.0"
description = "Canonical machine-readable Agent Work Model and toolchain"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "The Agent Work Model Authors" }]
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
  "referencing==0.36.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[project.scripts]
awm = "awm.cli:main"

[tool.setuptools.packages.find]
include = ["awm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
