name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate canonical source
        run: python -m awm validate

      - name: Semantic lint
        run: python -m awm lint

      - name: Generate derived artifacts
        run: python -m awm generate

      - name: Build documentation site
        run: python -m awm site

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  deploy:
    name: deploy-cloudflare-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://agent-work-model.org/
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=agent-work-model --branch=master --commit-dirty=true
