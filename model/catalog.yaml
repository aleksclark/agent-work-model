# Canonical catalog for the Agent Work Model.
# This file, together with terms/, rules/, and mappings/, is the source of truth.
# Generated prose and JSON are derived from these documents. Do not edit generated/.

model:
  name: Agent Work Model
  version: 0.1.0
  status: draft
  license: Apache-2.0
  canonical_source: model/
  description: >-
    Protocol-neutral semantic interoperability model for agent work. The
    machine-readable documents under model/ are canonical for terms,
    relationships, ownership, lifecycle, aliases, mappings, and guidance.

load:
  terms: terms
  rules: rules
  mappings: mappings

term_keys:
  - Project
  - ProjectSnapshot
  - WorkProfile
  - Resource
  - ResourceBinding
  - Workspace
  - WorkSession
  - AgentProfile
  - AgentInstance
  - AgentRun
  - RunAttempt
  - Turn
  - HostConversation
  - Task
  - Artifact
  - Principal

systems:
  - project-interop
  - awesometree
  - mcp
  - goose
  - hermes
  - crush

# External authority roles. A term's authority.owner names exactly one of
# these roles. The owner is never the term itself and never another entity.
# Roles name SYSTEM/ROLE boundaries only; they do not encode credentials
# or endpoints.
authority_roles:
  - id: project-catalog
    description: >-
      Durable project-definition catalog. Owns Project and ProjectSnapshot
      records and their published policy snapshots.
  - id: profile-catalog
    description: >-
      Profile-definition catalog. Owns WorkProfile and AgentProfile
      blueprints independently of any live run.
  - id: native-resource-provider
    description: >-
      Native owner of an independently addressable Resource. Project and
      session records only reference or bind it.
  - id: workspace-provider
    description: >-
      Workspace host or runtime that materializes a working environment.
  - id: work-session-coordinator
    description: >-
      Runtime coordinator for a WorkSession and the bindings, tasks, and
      artifacts that exist only inside that episode.
  - id: agent-runtime
    description: >-
      Supervisor that owns AgentInstance liveness for a process or endpoint.
  - id: agent-executor
    description: >-
      Host executor that records RunAttempts and Turns for an assigned run.
  - id: host-product
    description: >-
      Host product that owns HostConversation history. Distinct from work
      coordination and from protocol connections.
  - id: artifact-publisher
    description: >-
      Publishing authority for an Artifact's publication metadata.
  - id: identity-provider
    description: >-
      Issuer of Principal names. Does not confer authorization by itself.

conventions:
  identity_field_pattern: '^[a-z]+(_[a-z0-9]+)*_id$'
  prohibited_unqualified_fields:
    - session
    - agent
    - context
    - session_id
    - agent_id
    - context_id
  runtime_field_name_patterns:
    - '(^|_)pid($|_)'
    - '(^|_)port($|_)'
    - heartbeat
    - current_workspace
    - current_run
    - current_conversation
  runtime_field_kinds:
    - runtime
    - process
    - heartbeat
    - connection
  credential_field_kinds:
    - credential
    - secret
    - token
  no_runtime_state_terms:
    - Project
    - ProjectSnapshot
  immutable_terms:
    - ProjectSnapshot
  exact_parent:
    AgentRun:
      term: WorkSession
      cardinality: "1"
