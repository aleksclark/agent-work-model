system: mcp
status: reviewed
description: >-
  Mapping hook for the Model Context Protocol specification dated
  2026-07-28. MCP is a stateless tool-and-resource protocol. It does not
  define Agent Work Model work episodes, protocol-level sessions, or a
  durable Project.
fidelity_overview: partial
verified_against: https://modelcontextprotocol.io/specification/2026-07-28
notes: >-
  Reviewed against
  https://modelcontextprotocol.io/specification/2026-07-28,
  https://modelcontextprotocol.io/specification/2026-07-28/changelog,
  https://modelcontextprotocol.io/specification/2026-07-28/deprecated,
  and https://modelcontextprotocol.io/extensions/tasks/overview.
  MCP removed protocol-level sessions and the Mcp-Session-Id header; the
  protocol is stateless. Roots are deprecated; new implementations pass
  directories and files via tool parameters, resource URIs, or server
  configuration. The optional Tasks extension
  io.modelcontextprotocol/tasks is a protocol-level long-running
  invocation, not an AWM WorkSession Task graph node. This document
  records those distinctions so implementations do not collapse MCP
  protocol objects onto work identity.
compatibility_field_mappings:
  - native_field: session
    awm_field: (none)
    notes: >-
      MCP 2026-07-28 has no protocol-level session. Historical "session"
      spellings MUST NOT be imported onto AWM terms.
  - native_field: Mcp-Session-Id
    awm_field: (none)
    notes: >-
      MCP 2026-07-28 removed Mcp-Session-Id. Historical identifiers MUST
      NOT be imported as unqualified session_id fields on AWM terms.
  - native_field: session_id
    awm_field: (none)
    notes: >-
      There is no current MCP session identifier. Do not keep session_id
      on an AWM term.
terms:
  Project:
    native_term: null
    fidelity: none
    notes: MCP has no durable collaboration-and-policy Project.
  ProjectSnapshot:
    native_term: null
    fidelity: none
  WorkProfile:
    native_term: null
    fidelity: none
  Resource:
    native_term: Resource
    fidelity: partial
    notes: MCP Resources are addressable. They are not project-owned and have no AWM binding model.
  ResourceBinding:
    native_term: Root
    fidelity: partial
    notes: >-
      MCP roots are deprecated in 2026-07-28. Historical roots resembled
      grants; they are not WorkSession bindings. New implementations pass
      directories and files via tool parameters, resource URIs, or server
      configuration.
  Workspace:
    native_term: Root
    fidelity: partial
    notes: >-
      A historical MCP root could expose a filesystem-like environment.
      Roots are deprecated; they are not WorkSessions.
  WorkSession:
    native_term: null
    fidelity: none
    notes: >-
      MCP 2026-07-28 is stateless and has no protocol-level session.
      Explicit non-mapping.
  AgentProfile:
    native_term: null
    fidelity: none
  AgentInstance:
    native_term: Server
    fidelity: ambiguous
    notes: An MCP server process is infrastructure. Not verified as AgentInstance.
  AgentRun:
    native_term: null
    fidelity: none
    notes: MCP has no AgentRun. There is no protocol-level MCP session to confuse with one.
  RunAttempt:
    native_term: null
    fidelity: none
  Turn:
    native_term: null
    fidelity: none
  HostConversation:
    native_term: null
    fidelity: none
  Task:
    native_term: Task
    fidelity: partial
    notes: >-
      MCP's optional Tasks extension (io.modelcontextprotocol/tasks) can
      track a long-running tool invocation. An AWM Task is a WorkSession
      graph node with session-owned lifecycle, dependencies, and
      artifacts. Related at the word "task" only; not a WorkSession Task.
  Artifact:
    native_term: Resource
    fidelity: ambiguous
    notes: Exposing a file as an MCP resource does not make it a published Artifact.
  Principal:
    native_term: null
    fidelity: tbd
    notes: Auth is transport-specific.
