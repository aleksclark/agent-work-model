system: goose
status: draft
description: >-
  Mapping hook for Goose. Goose is a host product that owns conversation
  history. Its word "session" is treated as ambiguous until a specific
  Goose revision is reviewed.
fidelity_overview: ambiguous
verified_against: null
notes: >-
  Do not assert that a Goose session is a WorkSession or an AgentRun.
  The conservative reading is HostConversation, and even that is only
  partial and unverified.
compatibility_field_mappings:
  - native_field: session
    awm_field: host_conversation_id
    notes: Compatibility hint only. Goose session is not accepted as WorkSession.
  - native_field: session_id
    awm_field: host_conversation_id
    notes: If imported, rewrite to a qualified host field. Never keep session_id on an AWM term.
