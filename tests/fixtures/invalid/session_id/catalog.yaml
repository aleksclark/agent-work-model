model:
  name: Fixture
  version: 0.0.0
  status: draft
  license: Apache-2.0
  canonical_source: model/
  description: Invalid fixture planting an unqualified session_id field.
load:
  terms: terms
  rules: rules
  mappings: mappings
term_keys:
  - WorkSession
systems:
  - fixture
authority_roles:
  - id: fixture-catalog
    description: Fixture authority role used only by tests.
conventions:
  identity_field_pattern: '^[a-z]+(_[a-z0-9]+)*_id$'
  prohibited_unqualified_fields:
    - session
    - agent
    - context
    - session_id
    - agent_id
    - context_id
  runtime_field_name_patterns:
    - '(^|_)pid($|_)'
    - heartbeat
  runtime_field_kinds:
    - runtime
  credential_field_kinds:
    - credential
    - secret
    - token
  no_runtime_state_terms:
    - Project
    - ProjectSnapshot
  immutable_terms:
    - ProjectSnapshot
  exact_parent: {}
